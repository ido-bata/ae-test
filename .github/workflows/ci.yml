name: ci

on:
  pull_request:
  push:
    branches: [main, "release-*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # @ido-bata/ae-a8n comes from the public npm registry, pinned to an exact
    # version with its integrity in package-lock.json: no token, no OIDC, no
    # second repository. See docs/dependency-on-ae-a8n.md.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: jdx/mise-action@v2
        with:
          version: 2026.9.12
          install: true

      # `npm ci`, not `npm install`: the lockfile is the record of exactly
      # which ae-a8n tarball (sha512) this run validates against.
      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Record which ae-a8n this run validated against
        run: |
          mise exec -- node -e '
            const { readFileSync } = require("node:fs");
            const lock = JSON.parse(readFileSync("package-lock.json", "utf-8")).packages["node_modules/@ido-bata/ae-a8n"];
            const installed = JSON.parse(readFileSync("node_modules/@ido-bata/ae-a8n/package.json", "utf-8")).version;
            if (installed !== lock.version) { console.error(`::error::installed ${installed}, lockfile ${lock.version}`); process.exit(1); }
            console.log(`ae-a8n ${lock.version} ${lock.resolved} ${lock.integrity}`);
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      # Tests and specs import ../dist, so build before type-checking them.
      - name: Build
        run: mise exec -- npm run build

      - name: Typecheck
        run: mise exec -- npm run typecheck

      - name: Lint
        run: mise exec -- npm run lint

      - name: Test
        run: mise exec -- npm run test

      # Proves the CLI can run a suite unattended against the fake host: launch,
      # operate, render, assert, collect, tear down, with no human input.
      - name: Smoke the CLI
        run: |
          mise exec -- npm run ae-test -- \
            specs/plugin-render.spec.ts \
            --results-dir .ae-test-results \
            --projects-dir fixtures \
            --fake-host \
            --update-snapshots
          mise exec -- npm run ae-test -- \
            specs/plugin-render.spec.ts \
            --results-dir .ae-test-results \
            --projects-dir fixtures \
            --fake-host

      # The repository's specs import ../dist; this installs the packed
      # tarball into an empty project and runs specs that import
      # @ido-bata/ae-test by name through the installed binary.
      - name: Check the package as a consumer gets it
        run: mise exec -- node scripts/check-packed-package.js

  # The release tooling's tests on native Windows, checked out as Git for
  # Windows does by default (core.autocrlf=true, so CRLF files): the publish
  # gate (registry over HTTP, no shell), the README examples, and staging
  # with the real npm CLI against a recording registry.
  release-tooling-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out with CRLF line ends
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Confirm the checkout is CRLF
        shell: bash
        run: |
          eol=$(git ls-files --eol README.md .github/workflows/publish.yml)
          echo "$eol"
          if [ "$(echo "$eol" | grep -c 'w/crlf')" != 2 ]; then
            echo "::error::the working tree is not CRLF; this job would not exercise it"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # The README examples are type-checked against dist.
      - name: Build
        run: npm run build

      - name: Release tooling tests
        run: npx vitest run test/publish-gate.test.ts test/readme.test.ts test/stage-publish.test.ts
