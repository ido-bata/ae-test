name: ci

on:
  pull_request:
  push:
    branches: [main, "release-*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # ae-a8n is consumed as a `file:../ae-a8n` dependency until it is
      # published, so it has to be present and built before anything here can
      # typecheck or run.
      #
      # ido-bata/ae-a8n is a *private* repository, and the default GITHUB_TOKEN
      # cannot read another private repository. This job therefore uses a
      # fine-grained token, supplied as a secret **on this repository** — the
      # one whose workflow uses it. The token itself is scoped to ae-a8n alone
      # with Contents: Read-only; it is not given access to this repository.
      #
      # This step and the two below it are temporary. Once ae-a8n is published,
      # `dependencies` becomes a registry version, the checkout steps are
      # deleted, and the token is revoked. See docs/dependency-on-ae-a8n.md.
      - name: Require a token for the private sibling repository
        env:
          AE_A8N_TOKEN: ${{ secrets.AE_A8N_TOKEN }}
        run: |
          if [ -z "$AE_A8N_TOKEN" ]; then
            echo "::error::AE_A8N_TOKEN is not configured on this repository."
            echo "::error::See docs/dependency-on-ae-a8n.md for the exact setup."
            echo "::error::Short version: a fine-grained token owned by ido-bata, with Repository access = ae-a8n only and Contents = Read-only, stored here as a repository secret named AE_A8N_TOKEN."
            exit 1
          fi

      - name: Check out ae-a8n
        uses: actions/checkout@v5
        with:
          repository: ido-bata/ae-a8n
          path: ae-a8n
          # Branch by default so ae-a8n's fixes reach here without a manual
          # bump. Override with the AE_A8N_REF repository variable to pin.
          ref: ${{ vars.AE_A8N_REF || 'release-0-1-0' }}
          token: ${{ secrets.AE_A8N_TOKEN }}

      # Validation evidence has to be bound to an immutable identity, and
      # "release-0-1-0" is not one. Recording the resolved SHA makes each run
      # attributable to the exact ae-a8n commit it was checked against.
      - name: Record which ae-a8n commit this run validated against
        working-directory: ae-a8n
        run: |
          echo "ae-a8n commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "ae-a8n subject: $(git log -1 --format=%s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install toolchain
        uses: jdx/mise-action@v2
        with:
          version: 2026.9.12
          install: true

      - name: Build ae-a8n
        working-directory: ae-a8n
        run: |
          mise exec -- npm ci
          mise exec -- npm run build

      - name: Install dependencies
        run: mise exec -- npm install

      - name: Typecheck
        run: mise exec -- npm run typecheck

      - name: Lint
        run: mise exec -- npm run lint

      - name: Test
        run: mise exec -- npm run test

      - name: Build
        run: mise exec -- npm run build

      # Proves the CLI can run a suite unattended against the fake host: launch,
      # operate, render, assert, collect, tear down, with no human input.
      - name: Smoke the CLI
        run: |
          mise exec -- npm run ae-test -- \
            specs/plugin-render.spec.ts \
            --results-dir .ae-test-results \
            --projects-dir fixtures \
            --fake-host \
            --update-snapshots
          mise exec -- npm run ae-test -- \
            specs/plugin-render.spec.ts \
            --results-dir .ae-test-results \
            --projects-dir fixtures \
            --fake-host
